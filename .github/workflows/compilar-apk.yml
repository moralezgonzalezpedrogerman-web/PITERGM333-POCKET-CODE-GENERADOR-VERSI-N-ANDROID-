name: Compilar PITER POCKET CODE GENERADOR (Android)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Descomprimir
        run: unzip -q PITER-POCKET-CODE-GENERADOR-ANDROID-proyecto.zip -d app
      - name: Motor de Windows (Electron) para los juegos
        working-directory: app
        run: |
          mkdir et && cd et && npm init -y > /dev/null
          npm_config_platform=win32 npm_config_arch=x64 npm install electron@33 --no-save --no-audit --no-fund || true
          if [ ! -f node_modules/electron/dist/electron.exe ]; then
            V=$(node -p "require('./node_modules/electron/package.json').version")
            echo "Descargando electron $V para Windows"
            curl -L -o win.zip "https://github.com/electron/electron/releases/download/v$V/electron-v$V-win32-x64.zip"
            mkdir -p node_modules/electron/dist && unzip -q -o win.zip -d node_modules/electron/dist
          fi
          cd ..
          python3 make_template.py et/node_modules/electron/dist www/runtime-template.zip
      - name: Compilar APK
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          PKG=android/app/src/main/java/com/piter/pocketcodegenerador
          cp android-native/*.java $PKG/
          npx cap sync android
          cd android
          chmod +x gradlew
          if ! ./gradlew assembleDebug --no-daemon; then
            echo "Fallo con el selector de carpetas; compilando sin el (se usara Guardar/Enviar)"
            cd ..
            rm -f $PKG/FolderSaverPlugin.java
            printf 'package com.piter.pocketcodegenerador;\nimport com.getcapacitor.BridgeActivity;\npublic class MainActivity extends BridgeActivity {}\n' > $PKG/MainActivity.java
            cd android && ./gradlew assembleDebug --no-daemon
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: PITER-POCKET-CODE-GENERADOR-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
